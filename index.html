<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Painel - Cartão Manutenção</title>

    <!-- Tailwind CSS (Estilização Base) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ========================================================= -->
    <!-- 1. BLOCO CSS (CONGELAMENTO E ALÇA DE REDIMENSIONAMENTO)   -->
    <!-- ========================================================= -->
    <style>
        /* Container com rolagem interna */
        .table-container {
            max-height: 65vh;
            overflow: auto;
        }

        /* 1. CSS para Congelar o Cabeçalho */
        thead th {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* 2. CSS para Congelar a 1ª e 2ª Colunas */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 10;
        }

        .sticky-col-2 {
            position: sticky;
            left: 110px; /* Posição ajustada dinamicamente pelo JS ao redimensionar */
            z-index: 10;
        }

        /* 3. CSS para a Alça de Redimensionamento */
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 7px;
            cursor: col-resize;
            user-select: none;
        }

        .resizer:hover, .resizer.resizing {
            background-color: #3b82f6; /* Destaque azul ao arrastar */
        }
    </style>
</head>

<body>
    <!-- Estrutura do Dashboard e Tabela -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="sticky-col-1">NTE <div class="resizer"></div></th>
                    <th class="sticky-col-2">Município <div class="resizer"></div></th>
                    <th>Código SEC <div class="resizer"></div></th>
                    <!-- Demais colunas... -->
                </tr>
            </thead>
            <tbody>
                <!-- Linhas dinâmicas preenchidas via JS -->
            </tbody>
        </table>
    </div>

    <!-- ========================================================= -->
    <!-- 2. BLOCO JAVASCRIPT (LÓGICA DE ARRASTAR E RENDERIZAR)     -->
    <!-- ========================================================= -->
    <script>
        // Lógica para permitir arrastar e redimensionar no CSS
        function initColumnResizing() {
            const cols = document.querySelectorAll('th');
            cols.forEach(col => {
                const resizer = col.querySelector('.resizer');
                if (!resizer) return;

                resizer.addEventListener('mousedown', (e) => {
                    let startX = e.clientX;
                    let startWidth = col.offsetWidth;

                    const onMouseMove = (e) => {
                        const newWidth = Math.max(60, startWidth + (e.clientX - startX));
                        col.style.width = `${newWidth}px`;
                        updateStickyPositions(); // Recalcula a posição sticky da 2ª coluna
                    };

                    const onMouseUp = () => {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }
    </script>
</body>
</html>
